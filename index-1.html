<!DOCTYPE html>
<html lang="sw"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zahanati Pro – Clinic & Lab</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style type="text/tailwindcss">
.card{@apply bg-white rounded-2xl border border-slate-200 p-4 shadow-sm}
.btn{@apply inline-flex items-center justify-center gap-1 rounded-xl bg-teal-600 text-white text-sm font-semibold px-3 py-2 active:scale-95 hover:bg-teal-700}
.btn2{@apply inline-flex items-center justify-center gap-1 rounded-xl bg-teal-50 text-teal-700 text-sm font-semibold px-3 py-2 hover:bg-teal-100}
.inp{@apply w-full rounded-xl border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-500}
.lbl{@apply block text-xs font-semibold text-slate-600 mb-1}
.bdg{@apply inline-block rounded-full px-2 py-0.5 text-xs font-semibold}
</style>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
html,body{background:#f1f5f9;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
@media print{body *{visibility:hidden}#doc,#doc *{visibility:visible}#doc{position:absolute;left:0;top:0;width:100%}.noprint{display:none!important}}
</style></head>
<body class="text-slate-800">
<aside id="side" class="hidden md:flex fixed inset-y-0 left-0 w-60 bg-gradient-to-b from-teal-700 to-emerald-800 text-white flex-col p-4 gap-1"></aside>
<main id="view" class="md:pl-64 p-4 pb-28 max-w-6xl mx-auto"></main>
<nav id="bot" class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 grid grid-cols-5 z-30" style="padding-bottom:env(safe-area-inset-bottom,0px)"></nav>
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/50 items-end md:items-center justify-center p-0 md:p-4"></div>

<script>
const K='zp_v1',$=s=>document.querySelector(s);
const today=(o=0)=>new Date(Date.now()-o*864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const nowTs=()=>today()+'T'+new Date().toTimeString().slice(0,5);
const TZS=n=>'TZS '+Number(n).toLocaleString('en-US');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdt=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const TESTS=[['Malaria BS',3000,'Negative'],['Full Blood Count (FBC)',10000,'Hb 12-16 g/dL; WBC 4-11 x10^9/L'],['Urinalysis',5000,'Protein/Glucose: Negative'],['Typhoid (Widal)',5000,'Titre < 1:80'],['Blood Sugar (RBS)',3000,'3.9-7.8 mmol/L'],['HIV Rapid Test',2000,'Non-reactive']];
const STAT=['Waiting Consultation','At Laboratory','At Pharmacy','Payment Pending','Completed'];
const SCOL=['bg-amber-100 text-amber-700','bg-sky-100 text-sky-700','bg-violet-100 text-violet-700','bg-rose-100 text-rose-700','bg-emerald-100 text-emerald-700'];
const SSW=['Anasubiri Daktari','Maabara','Duka la Dawa','Malipo Yanasubiri','Amekamilika'];
const METH=['Cash','M-Pesa','Airtel Money','Tigo Pesa','Bank Transfer'];

function seed(){
  const d={seq:100,set:{name:'Chato Afya Private Clinic',addr:'Chato, Geita – Tanzania',tel:'+255 700 000 000',fee:5000},patients:[],labs:[],bills:[],claims:[],
  drugs:[[1,'Panadol 500mg (tab)',200,400],[2,'Amoxicillin 500mg (cap)',500,200],[3,'Artemether/Lumefantrine (course)',3000,60],[4,'ORS Sachet',500,80],[5,'Metronidazole 400mg (tab)',300,150],[6,'Cotrimoxazole 480mg (tab)',150,12]].map(a=>({id:a[0],n:a[1],p:a[2],s:a[3]}))};
  const P=[['Juma Hassan',34,'Male','0712 345 678','Outpatient',1,0],['Amina Ali',28,'Female','0754 222 111','Insurance',2,0],['Neema Joseph',6,'Female','0765 908 070','Outpatient',3,0],['Said Bakari',41,'Male','0689 450 330','Outpatient',0,0],
  ['Baraka Mwita',45,'Male','0713 777 001','Insurance',4,0],['Zawadi Msafiri',52,'Female','0742 119 888','Outpatient',4,1],['Hamisi Juma',19,'Male','0655 100 200','Outpatient',4,1],['Rehema Paulo',31,'Female','0786 454 545','Insurance',4,2],['Elias Kassim',60,'Male','0711 909 090','Outpatient',4,3],['Grace Mussa',23,'Female','0757 321 654','Outpatient',4,3],['Peter Lucas',37,'Male','0620 111 222','Outpatient',4,4],['Mariam Omari',29,'Female','0763 555 000','Outpatient',4,5],['Joseph Magesa',48,'Male','0714 828 282','Insurance',4,6]];
  P.forEach((a,i)=>{const id=i+1,p={id,name:a[0],age:a[1],g:a[2],tel:a[3],ec:'0700 '+(100000+id*137),cat:a[4],status:STAT[a[5]],date:today(a[6]),rx:[]};d.patients.push(p);
    if(a[5]==4){const t=TESTS[i%4],m=METH[i%5],amt=d.set.fee+t[1];d.labs.push({id:id*10,pid:id,test:t[0],price:t[1],range:t[2],date:today(a[6]),done:1,result:i%3?'Negative':'Positive (+)',remark:'',ts:today(a[6])+'T09:40'});d.bills.push({id:id,pid:id,name:a[0],amt,method:m,ts:today(a[6])+'T10:'+(10+i*3),items:'Consultation + '+t[0]})}});
  d.labs.push({id:1001,pid:1,test:TESTS[0][0],price:3000,range:TESTS[0][2],date:today(),done:0},{id:1002,pid:1,test:TESTS[1][0],price:10000,range:TESTS[1][2],date:today(),done:0},{id:1003,pid:3,test:TESTS[0][0],price:3000,range:TESTS[0][2],date:today(),done:1,result:'Positive (++)',remark:'Plasmodium falciparum seen',ts:today()+'T08:50'});
  d.patients[1].rxNote='Artemether/Lumefantrine (ALu) 1 course\nPanadol 500mg 1 tab mara 3 kwa siku 2';d.patients[1].rx=[];d.patients[2].rx=[{id:3,q:1},{id:4,q:2}];d.patients[2].disp=1;
  return d}
let db={set:{name:'Chato Afya Private Clinic',addr:'Chato, Geita – Tanzania',tel:'+255 700 000 000',fee:5000},patients:[],labs:[],bills:[],claims:[],drugs:[],log:[],users:[]};
const ROLES={boss:['dash','pat','lab','rx','bill'],rec:['pat'],co:['pat','lab','rx'],lab:['lab'],cash:['bill'],ph:['rx']};
const PERM={disp:['boss','ph'],reg:['boss','rec'],clin:['boss','co'],lab:['boss','lab'],pay:['boss','cash']};
let me=null;window.setMe=x=>{me=x;if(x)view=ROLES[x.role][0];render()};window.getDb=()=>db;
const can=a=>!!me&&PERM[a].includes(me.role);
const logA=a=>{db.log.unshift({ts:nowTs(),who:me?me.name:'?',a});db.log=db.log.slice(0,100);window.FB&&window.FB.log({ts:nowTs(),who:me?me.name:'?',a})};
const save=()=>window.FB&&window.FB.sync();
const uid=()=>Date.now()*1000+Math.floor(Math.random()*1000);
const P=id=>db.patients.find(p=>p.id==id);
const bdg=p=>{const i=STAT.indexOf(p.status);return `<span class="bdg ${SCOL[i]}">${SSW[i]} · ${p.status}</span>`};
function bill(p){
  const lines=[{n:'Consultation / Ushauri',q:1,t:db.set.fee}];
  db.labs.filter(l=>l.pid==p.id&&(l.vid||0)==(p.vid||0)).forEach(l=>lines.push({n:l.test,q:1,t:l.price}));
  (p.rx||[]).forEach(r=>{const d=db.drugs.find(x=>x.id==r.id);if(d)lines.push({n:d.n,q:r.q,t:d.p*r.q})});
  return{lines,total:lines.reduce((a,l)=>a+l.t,0)}}

/* ---------- UI helpers ---------- */
function modal(title,body){const m=$('#modal');m.className='flex fixed inset-0 z-50 bg-black/50 items-end md:items-center justify-center md:p-4';
  m.innerHTML=`<div class="bg-white w-full md:max-w-lg rounded-t-3xl md:rounded-3xl max-h-[92vh] overflow-y-auto p-5"><div class="flex justify-between items-center mb-3 noprint"><h3 class="font-bold text-lg text-teal-800">${title}</h3><button class="btn2" onclick="closeModal()">✕</button></div>${body}</div>`;icons()}
function closeModal(){const m=$('#modal');m.className='hidden';m.innerHTML='';if(window.PENDING){window.PENDING=0;render()}}
const busy=()=>{const a=document.activeElement;return !$('#modal').classList.contains('hidden')||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))};
window.softRender=()=>{if(!me)return render();if(busy())window.PENDING=1;else render()};
document.addEventListener('focusout',()=>setTimeout(()=>{if(window.PENDING&&!busy()){window.PENDING=0;render()}},250));
const icons=()=>{try{lucide.createIcons()}catch(e){}};
const EMO={'layout-dashboard':'📊',users:'👥','flask-conical':'🧪',pill:'💊',receipt:'🧾','heart-pulse':'🏥','user-plus':'➕',settings:'⚙️','log-out':'🚪','help-circle':'❓',check:'✔️',send:'📤',save:'💾',printer:'🖨️','package-check':'📦',wallet:'💰',plus:'➕',copy:'📋','notebook-pen':'📝',pencil:'✏️',banknote:'💵',clock:'⏰'};
const ic=n=>`<span class="text-base leading-none">${EMO[n]||''}</span>`;
const hdr=()=>`<div class="text-center border-b-2 border-teal-700 pb-2 mb-3"><div class="text-xl font-extrabold text-teal-800">${esc(db.set.name)}</div><div class="text-xs text-slate-500">${esc(db.set.addr)} · ${esc(db.set.tel)}</div></div>`;
const doc=(h,x='')=>modal('Hati / Document',`<div id="doc" class="p-2 text-sm">${h}</div><button class="btn w-full mt-4 noprint" onclick="window.print()">${ic('printer')} Chapisha / Print</button>${x}`);

/* ---------- Navigation ---------- */
let view=db.seen?'dash':'help',q='';
const STEPS=[['Sajili Mgonjwa','Bonyeza "Sajili", jaza jina, umri, jinsia na simu, kisha "Hifadhi".','pat'],['Tuma Maabara','Kwenye kadi ya mgonjwa bonyeza "Lab", chagua kipimo, kisha "Tuma Maabara".','pat'],['Weka Matokeo','Nenda Maabara, andika matokeo, bonyeza "Kamilisha". Unaweza kuchapisha karatasi ya matokeo.','lab'],['Andika Dawa','Daktari: kwenye kadi ya mgonjwa bonyeza "Dawa", andika dawa kwa maneno, kisha "Tuma Duka la Dawa".','pat'],['Toa Dawa','Duka la Dawa: soma maelekezo ya daktari, bonyeza "Toa Dawa", chagua dawa na idadi. Stock inapungua yenyewe.','rx'],['Lipa na Risiti','Nenda Bili, chagua njia ya malipo, bonyeza "Lipa", kisha chapisha risiti.','bill'],['Angalia Mapato','Dashibodi inaonyesha wagonjwa wa leo, mapato na malipo yanayosubiri.','dash']];
V_help=()=>{db.seen=1;save();return `<h1 class="text-2xl font-extrabold text-teal-800">Anza Hapa / Start Here</h1><p class="text-sm text-slate-600 mb-4">Fuata hatua hizi 7 kwa mgonjwa mmoja wa majaribio. Bonyeza kitufe kwenda sehemu husika.</p><div class="space-y-3">${STEPS.map((s,i)=>`<div class="card flex gap-3 items-start"><div class="w-9 h-9 shrink-0 rounded-full bg-teal-600 text-white font-bold flex items-center justify-center">${i+1}</div><div class="flex-1"><b>${s[0]}</b><p class="text-sm text-slate-600 mb-2">${s[1]}</p><button class="btn2" onclick="go('${s[2]}')">Nenda / Go →</button></div></div>`).join('')}</div><div class="card mt-4 text-sm bg-amber-50 border-amber-200">Data ya mfano ipo ili uone jinsi mfumo unavyofanya kazi. Kuanza upya na data tupu: Mipangilio → "Reset sample data".</div>`};
const NAV0=[['dash','layout-dashboard','Dashibodi','Dashboard'],['pat','users','Wagonjwa','Patients'],['lab','flask-conical','Maabara','Lab'],['rx','pill','Dawa','Pharmacy'],['bill','receipt','Bili','Billing']];
function go(v){view=v;render();window.scrollTo(0,0)}
function loginUI(){return `<div class="max-w-sm mx-auto mt-10 card text-center"><div class="text-teal-700 flex justify-center">${ic('heart-pulse')}</div><h1 class="text-xl font-extrabold text-teal-800">Zahanati Pro</h1><p class="text-xs text-slate-500 mb-4">${esc(db.set.name)}<br>Ingia / Sign in</p><input id="lu" type="email" autocomplete="username" class="inp mb-2" placeholder="Barua pepe / Email"><input id="lp" type="password" autocomplete="current-password" class="inp mb-2" placeholder="Nenosiri / Password" onkeydown="if(event.key=='Enter')login()"><button class="btn w-full" onclick="login()">Ingia / Login</button><p id="le" class="text-rose-600 text-xs mt-2">${window.READY?'':'Inapakia… / Loading…'}</p></div>`}
function login(){const e=$('#lu').value.trim(),p=$('#lp').value;if(!e||!p)return;if(!window.FB)return $('#le').textContent='Mtandao unahitajika / Internet needed';$('#le').textContent='…';window.FB.login(e,p).then(r=>{$('#le').textContent=r||''})}
function logout(){window.FB.logout()}
const topBar=()=>`<div class="md:hidden flex justify-between items-center mb-3 text-xs text-slate-500"><span>👤 ${esc(me.name)}</span><span class="flex gap-2">${me.role=='boss'?`<button class="btn2 !py-1" onclick="settings()">${ic('settings')} Mipangilio</button>`:''}<button class="btn2 !py-1" onclick="logout()">${ic('log-out')} Toka</button></span></div>`;
function render(){
  $('#side').style.display=$('#bot').style.display=me?'':'none';
  if(!me){$('#view').innerHTML=loginUI();icons();return}
  if(view!='help'&&!ROLES[me.role].includes(view))view=ROLES[me.role][0];
  const NAV=NAV0.filter(n=>ROLES[me.role].includes(n[0]));
  $('#side').innerHTML=`<div class="text-xl font-extrabold mb-1 flex items-center gap-2">${ic('heart-pulse')} Zahanati Pro</div><div class="text-xs text-teal-100">${esc(db.set.name)}</div><div class="text-xs bg-white/15 rounded-lg px-2 py-1 mb-3 mt-2">👤 ${esc(me.name)}</div>`+NAV.map(n=>`<button onclick="go('${n[0]}')" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-left ${view==n[0]?'bg-white/20 font-bold':'hover:bg-white/10'}">${ic(n[1])}<span>${n[2]}<span class="block text-[10px] opacity-70">${n[3]}</span></span></button>`).join('')+`<button onclick="go('help')" class="flex items-center gap-2 text-sm px-3 py-2 mt-2 rounded-xl ${view=='help'?'bg-white/20 font-bold':'hover:bg-white/10'}">${ic('help-circle')} Anza Hapa / Start Here</button>${me.role=='boss'?`<button onclick="settings()" class="mt-auto flex items-center gap-2 text-sm opacity-80 px-3 py-2">${ic('settings')} Mipangilio / Settings</button>`:''}<button onclick="logout()" class="${me.role=='boss'?'':'mt-auto '}flex items-center gap-2 text-sm opacity-80 px-3 py-2">${ic('log-out')} Toka / Logout</button>`;
  const NB=NAV.concat([['help','help-circle','Msaada','Help']]);$('#bot').style.gridTemplateColumns='repeat('+NB.length+',1fr)';$('#bot').innerHTML=NB.map(n=>`<button onclick="go('${n[0]}')" class="flex flex-col items-center py-2 text-[10px] ${view==n[0]?'text-teal-700 font-bold':'text-slate-500'}">${ic(n[1])}${n[2]}</button>`).join('');
  $('#view').innerHTML=topBar()+V[view]();icons();if(view=='dash')charts()}

/* ---------- Views ---------- */
const V={
dash(){const t=today(),np=db.patients.filter(p=>p.date==t).length,nl=db.labs.filter(l=>l.done&&l.date==t).length,rev=db.bills.filter(b=>!b.void&&b.ts.slice(0,10)==t).reduce((a,b)=>a+b.amt,0),pend=db.patients.filter(p=>p.status==STAT[3]),pa=pend.reduce((a,p)=>a+bill(p).total,0);
  const C=(i,l,s,v,c)=>`<div class="card"><div class="flex items-center gap-2 text-xs text-slate-500">${ic(i)}<span>${l}<br><span class="opacity-70">${s}</span></span></div><div class="text-2xl font-extrabold mt-2 ${c}">${v}</div></div>`;
  return `<div class="flex justify-between items-center mb-4"><div><h1 class="text-2xl font-extrabold text-teal-800">Karibu / Welcome</h1><p class="text-xs text-slate-500">${new Date().toDateString()}</p></div><div class="flex gap-2"><button class="btn" onclick="go('help')">${ic('help-circle')} Anza Hapa</button></div></div>
  ${(l=>l.length?`<div class="card bg-rose-50 border-rose-200 text-sm mb-3">⚠ Dawa zinaisha / Low stock: <b>${l.map(d=>esc(d.n)+' ('+d.s+')').join(', ')}</b></div>`:'')(db.drugs.filter(d=>d.s<20))}${(l=>l.length?`<div class="card bg-amber-50 border-amber-200 text-sm mb-3">⏳ Dawa zinakwisha muda / Expiring or expired: <b>${l.map(d=>esc(d.n)+' ('+d.exp+')').join(', ')}</b></div>`:'')(db.drugs.filter(d=>d.exp&&(new Date(d.exp)-new Date(today()))/864e5<60))}<div class="grid grid-cols-2 lg:grid-cols-4 gap-3">${C('user-plus','Wagonjwa Leo','Registered Today',np,'text-teal-700')+C('flask-conical','Vipimo Vilivyokamilika','Lab Tests Done',nl,'text-cyan-700')+C('banknote','Mapato Leo','Revenue Today',TZS(rev).replace('TZS ','')+' <span class="text-xs">TZS</span>','text-emerald-700')+C('clock','Malipo Yanasubiri','Pending Payments',pend.length+' <span class="text-xs">('+TZS(pa).replace('TZS ','')+')</span>','text-rose-600')}</div>
  <div class="grid md:grid-cols-2 gap-3 mt-3"><div class="card"><h3 class="font-bold text-sm mb-2">Wagonjwa wa Wiki / Weekly Visits</h3><canvas id="c1" height="170"></canvas></div><div class="card"><h3 class="font-bold text-sm mb-2">Vipimo Maarufu / Top Lab Tests</h3><canvas id="c2" height="170"></canvas></div></div>
  <div class="card mt-3"><h3 class="font-bold text-sm mb-2">Muamala wa Hivi Karibuni / Recent Transactions</h3>${ledger(5)}</div>`},
pat(){const l=db.patients.filter(p=>(p.name+p.tel).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.id-a.id);
  return `<div class="flex gap-2 mb-3"><input class="inp" placeholder="Tafuta / Search..." value="${esc(q)}" oninput="q=this.value;clearTimeout(window.t);window.t=setTimeout(()=>{render();const i=document.querySelector('#view input');i.focus();i.setSelectionRange(q.length,q.length)},250)">${can('reg')?`<button class="btn whitespace-nowrap" onclick="regForm()">${ic('user-plus')} Sajili</button>`:''}</div>
  <h2 class="font-bold text-teal-800 mb-2">Usajili wa Mgonjwa / Patients (${l.length})</h2><div class="grid md:grid-cols-2 gap-3">${l.map(p=>`<div class="card"><div class="flex justify-between"><div><b>${esc(p.name)}</b><div class="text-xs text-slate-500">#P${String(p.id).slice(-4)} · ${p.age}y · ${p.g} · ${esc(p.tel)}</div></div><span class="bdg ${p.cat=='Insurance'?'bg-indigo-100 text-indigo-700':'bg-slate-100 text-slate-600'}">${p.cat=='Insurance'?'NHIF/Insurance':'Cash'}</span></div>
  <div class="my-2 flex items-center gap-2 flex-wrap">${bdg(p)}${can('reg')?`<button class="text-teal-700 text-xs underline" onclick="editForm(${p.id})">Hariri / Edit</button>`:''}<button class="text-teal-700 text-xs underline" onclick="fileView(${p.id})">Faili / File</button></div>${(p.hist||[]).length?`<p class="text-xs text-slate-600 mb-2 whitespace-pre-wrap">🩺 ${esc(p.hist[p.hist.length-1].t)}</p>`:''}${can('clin')?`<div class="flex gap-2 flex-wrap"><button class="btn2" onclick="labReq(${p.id})">${ic('flask-conical')} Lab</button><button class="btn2" onclick="rxForm(${p.id})">${ic('pill')} Dawa</button><button class="btn2" onclick="noteForm(${p.id})">${ic('notebook-pen')} Maelezo</button>
  <select class="inp !w-auto !py-1.5" onchange="setStat(${p.id},this.value)">${STAT.map(s=>`<option ${s==p.status?'selected':''}>${s}</option>`).join('')}</select></div>`:''}</div>`).join('')||'<p class="text-slate-500">Hakuna / None</p>'}</div>`},
lab(){const pe=db.labs.filter(l=>!l.done),dn=db.labs.filter(l=>l.done).sort((a,b)=>b.ts.localeCompare(a.ts)).slice(0,15);
  return `<h2 class="font-bold text-teal-800 mb-2">Vipimo vya Maabara / Pending Lab Requests (${pe.length})</h2><div class="grid md:grid-cols-2 gap-3">${pe.map(l=>`<div class="card space-y-2"><div class="flex justify-between"><b>${esc(l.test)}</b><span class="text-xs text-slate-500">${esc(P(l.pid).name)}</span></div>
  ${can('lab')?`<div><label class="lbl">Matokeo / Result</label><input id="r${l.id}" class="inp" placeholder="e.g. Positive (+)"></div><div><label class="lbl">Kiwango cha Kawaida / Reference Range</label><input id="g${l.id}" class="inp" value="${esc(l.range)}"></div><div><label class="lbl">Maelezo / Remarks</label><input id="m${l.id}" class="inp"></div>
  <button class="btn w-full" onclick="doneLab(${l.id})">${ic('check')} Kamilisha / Mark Completed</button>`:'<span class="bdg bg-amber-100 text-amber-700">Inasubiri maabara</span>'}</div>`).join('')||'<p class="text-slate-500 text-sm">Hakuna maombi / No pending requests ✔</p>'}</div>
  <h2 class="font-bold text-teal-800 mt-5 mb-2">Yaliyokamilika / Completed</h2><div class="space-y-2">${dn.map(l=>`<div class="card flex justify-between items-center"><div><b>${esc(l.test)}</b> — ${esc(P(l.pid).name)}<div class="text-xs text-slate-500">${esc(l.result)} · ${fdt(l.ts)}</div></div><button class="btn2" onclick="labSheet(${l.id})">${ic('printer')}</button></div>`).join('')}</div>`},
rx(){const qd=db.patients.filter(p=>p.status==STAT[2]);
  return `<h2 class="font-bold text-teal-800 mb-2">Foleni ya Dawa / Dispensing Queue (${qd.length})</h2><div class="grid md:grid-cols-2 gap-3">${qd.map(p=>{const rows=(p.rx||[]).map(r=>{const d=db.drugs.find(x=>x.id==r.id);return `<div class="flex justify-between text-sm"><span>${esc(d.n)} × ${r.q}</span><span>${TZS(d.p*r.q)}</span></div>`}).join('')||'<p class="text-xs text-slate-500">Bado hazijachaguliwa / Items not yet picked</p>';
  return `<div class="card"><b>${esc(p.name)}</b>${p.rxNote?`<div class="bg-amber-50 border border-amber-200 rounded-xl p-2 my-2 text-sm whitespace-pre-wrap"><span class="text-xs font-bold text-amber-700">Maelekezo ya Daktari / Doctor's note</span><br>${esc(p.rxNote)}</div>`:''}${rows}${can('disp')?`<button class="btn w-full mt-2" onclick="dispense(${p.id})">${ic('package-check')} Toa Dawa / Dispense</button>`:''}</div>`}).join('')||'<p class="text-slate-500 text-sm">Hakuna foleni / Queue empty</p>'}</div>
  <div class="flex justify-between items-center mt-5 mb-2"><h2 class="font-bold text-teal-800">Stoo ya Dawa / Pharmacy Stock</h2>${can('disp')?`<button class="btn" onclick="drugForm()">${ic('plus')} Dawa Mpya</button>`:''}</div><div class="card overflow-x-auto"><table class="w-full text-sm"><tr class="text-left text-xs text-slate-500"><th>Dawa</th><th>Bei</th><th>Stock</th><th></th></tr>${db.drugs.map(d=>`<tr class="border-t"><td class="py-2">${esc(d.n)}${d.exp?`<span class="block text-[10px] ${expCls(d.exp)}">Exp ${d.exp}${expired(d)?' – IMEKWISHA':''}</span>`:''}</td><td>${TZS(d.p)}</td><td class="${d.s<20?'text-rose-600 font-bold':''}">${d.s}${d.s<20?' ⚠':''}</td><td>${can('disp')?`<button class="btn2 !py-1" onclick="restock(${d.id})">+</button>`:''}${me.role=='boss'?`<button class="btn2 !py-1 ml-1" onclick="priceForm(${d.id})">TZS</button>`:''}</td></tr>`).join('')}</table></div>`},
bill(){const l=db.patients.filter(p=>p.status!=STAT[4]).sort((a,b)=>STAT.indexOf(b.status)-STAT.indexOf(a.status));
  return `<h2 class="font-bold text-teal-800 mb-2">Bili / Cashier Billing</h2><div class="grid md:grid-cols-2 gap-3">${l.map(p=>{const b=bill(p);return `<div class="card"><div class="flex justify-between"><b>${esc(p.name)}</b>${bdg(p)}</div><div class="my-2 space-y-0.5">${b.lines.map(x=>`<div class="flex justify-between text-sm"><span>${esc(x.n)}${x.q>1?' ×'+x.q:''}</span><span>${TZS(x.t)}</span></div>`).join('')}</div>
  <div class="flex justify-between font-extrabold border-t pt-2"><span>Jumla / Total</span><span class="text-teal-700">${TZS(b.total)}</span></div><label class="lbl mt-2">Kiasi cha kulipa / Amount paying now (TZS)</label><input id="pa${p.id}" type="number" min="1" value="${b.total}" class="inp mb-2"><div class="flex gap-2"><select id="pm${p.id}" class="inp">${METH.map(m=>`<option>${m}</option>`).join('')}</select><button class="btn" onclick="pay(${p.id})">${ic('wallet')} Lipa</button></div>${p.cat=='Insurance'?`<button class="btn2 w-full mt-2" onclick="claim(${p.id})">Tuma Madai ya Bima / Send to Insurance Claim</button>`:''}</div>`}).join('')||'<p class="text-slate-500 text-sm">Hakuna bili / No open bills</p>'}</div>
  ${debtsUI()}${claimsUI()}${(()=>{const t=today(),b=db.bills.filter(x=>!x.void&&x.ts.slice(0,10)==t),tot=b.reduce((a,x)=>a+x.amt,0);return `<div class="card mt-5"><div class="flex justify-between items-center mb-2"><h3 class="font-bold text-sm">Ripoti ya Kufunga Siku / Today's Close-out</h3><button class="btn2 !py-1" onclick="closeDoc()">${ic('printer')}</button></div>${METH.map(m=>{const s=b.filter(x=>x.method==m).reduce((a,x)=>a+x.amt,0);return s?`<div class="flex justify-between text-sm"><span>${m}</span><span>${TZS(s)}</span></div>`:''}).join('')}<div class="flex justify-between font-extrabold border-t mt-2 pt-2"><span>Jumla / Total (${b.length} risiti)</span><span class="text-teal-700">${TZS(tot)}</span></div></div>`})()}<h2 class="font-bold text-teal-800 mt-5 mb-2">Leja ya Mapato / Revenue Ledger</h2><div class="card">${ledger(50)}</div>`}
};
V.help=V_help;
function ledger(n){const b=[...db.bills].sort((a,c)=>c.ts.localeCompare(a.ts)).slice(0,n);
  return `<div class="overflow-x-auto"><table class="w-full text-sm"><tr class="text-left text-xs text-slate-500"><th>Muda</th><th>Mgonjwa</th><th>Njia</th><th>Na</th><th class="text-right">TZS</th><th></th></tr>${b.map(x=>`<tr class="border-t ${x.void?'line-through text-slate-400':''}"><td class="py-1.5 whitespace-nowrap">${fdt(x.ts)}</td><td>${esc(x.name)}</td><td>${esc(x.method)}</td><td class="text-xs text-slate-500">${esc(x.by||'—')}</td><td class="text-right font-semibold">${x.amt.toLocaleString('en-US')}</td><td class="whitespace-nowrap"><button onclick="receipt(${x.id})" class="text-teal-700 px-1">🧾</button>${me.role=='boss'&&!x.void?`<button onclick="voidForm(${x.id})" class="text-rose-600 px-1">✖</button>`:''}${x.void?`<span class="text-[10px]" title="${esc(x.vr)}">BATILI</span>`:''}</td></tr>`).join('')||'<tr><td colspan=5 class="text-slate-500 py-2">Hakuna / None</td></tr>'}</table></div>`}

/* ---------- Charts ---------- */
const CH={};
function charts(){if(typeof Chart=='undefined')return;Object.values(CH).forEach(c=>c.destroy());
  const days=[...Array(7)].map((_,i)=>today(6-i));
  CH.a=new Chart($('#c1'),{type:'line',data:{labels:days.map(d=>new Date(d).toLocaleDateString('en-GB',{weekday:'short'})),datasets:[{label:'Visits',data:days.map(d=>db.patients.reduce((a,p)=>a+(p.date==d?1:0)+(p.visits||[]).filter(v=>v.date==d).length,0)),borderColor:'#0d9488',backgroundColor:'rgba(13,148,136,.15)',fill:true,tension:.35}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}}}});
  const c={};db.labs.forEach(l=>c[l.test]=(c[l.test]||0)+1);const e=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,5);
  CH.b=new Chart($('#c2'),{type:'bar',data:{labels:e.map(x=>x[0].split(' (')[0]),datasets:[{data:e.map(x=>x[1]),backgroundColor:['#0d9488','#06b6d4','#10b981','#14b8a6','#22d3ee']}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,ticks:{precision:0}}}}})}

/* ---------- Actions ---------- */
function note(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='noprint fixed left-1/2 -translate-x-1/2 bottom-24 md:bottom-8 z-[60] bg-slate-800 text-white text-sm rounded-xl px-4 py-2 shadow-lg';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',3500)}
window.alert=note;
function ask(msg,fn){window._ask=fn;modal('Thibitisha / Confirm',`<p class="text-sm mb-4">${esc(msg)}</p><div class="flex gap-2"><button class="btn2 flex-1" onclick="closeModal()">Hapana / No</button><button class="btn flex-1" onclick="closeModal();window._ask()">Ndio / Yes</button></div>`)}
function regForm(){modal('Usajili wa Mgonjwa / Patient Registration',`<form onsubmit="regSave(event)" class="space-y-3">
  <div><label class="lbl">Jina Kamili / Full Name</label><input id="f_n" class="inp" required></div>
  <div class="grid grid-cols-2 gap-2"><div><label class="lbl">Umri / Age</label><input id="f_a" type="number" min="0" max="120" class="inp" required></div><div><label class="lbl">Jinsia / Gender</label><select id="f_g" class="inp"><option>Male</option><option>Female</option></select></div></div>
  <div><label class="lbl">Simu / Phone</label><input id="f_t" type="tel" class="inp" required></div><div><label class="lbl">Mawasiliano ya Dharura / Emergency Contact</label><input id="f_e" class="inp"></div>
  <div><label class="lbl">Aina / Category</label><select id="f_c" class="inp"><option value="Outpatient">Outpatient (Cash)</option><option value="Insurance">Insurance / NHIF</option></select></div>
  <button class="btn w-full">${ic('save')} Hifadhi / Save</button></form>`)}
function regSave(e){e.preventDefault();const id=uid();
  db.patients.push({id,name:$('#f_n').value.trim(),age:+$('#f_a').value,g:$('#f_g').value,tel:$('#f_t').value.trim(),ec:$('#f_e').value.trim(),cat:$('#f_c').value,status:STAT[0],date:today(),rx:[]});logA('Amesajili: '+$('#f_n').value.trim());save();closeModal();render()}
function setStat(id,s){P(id).status=s;save();render()}
function labReq(id){modal('Omba Kipimo / Request Lab Test',`<div class="space-y-2">${TESTS.map((t,i)=>`<label class="flex items-center gap-3 border rounded-xl p-3"><input type="checkbox" class="w-5 h-5 accent-teal-600 lt" value="${i}"><span class="flex-1 text-sm font-medium">${t[0]}</span><b class="text-sm">${TZS(t[1])}</b></label>`).join('')}</div><button class="btn w-full mt-3" onclick="labSave(${id})">${ic('send')} Tuma Maabara / Send to Lab</button>`)}
function labSave(id){const s=[...document.querySelectorAll('.lt:checked')].map(c=>TESTS[c.value]);if(!s.length)return alert('Chagua kipimo / Select a test');
  s.forEach(t=>db.labs.push({id:uid(),pid:id,vid:P(id).vid||0,test:t[0],price:t[1],range:t[2],date:today(),done:0}));P(id).status=STAT[1];save();closeModal();render()}
function doneLab(id){const l=db.labs.find(x=>x.id==id),r=$('#r'+id).value.trim();if(!r)return alert('Weka matokeo / Enter a result');
  Object.assign(l,{done:1,result:r,range:$('#g'+id).value,remark:$('#m'+id).value,ts:nowTs(),by:me.name});logA('Matokeo: '+l.test+' – '+P(l.pid).name);const p=P(l.pid);
  if(!db.labs.some(x=>x.pid==p.id&&!x.done)&&p.status==STAT[1])p.status=STAT[0];save();render()}
function labSheet(id){const l=db.labs.find(x=>x.id==id),p=P(l.pid);
  doc(`${hdr()}<h4 class="text-center font-bold mb-2">MATOKEO YA MAABARA / LABORATORY RESULT</h4><div class="grid grid-cols-2 gap-1 mb-3 text-xs"><div>Jina: <b>${esc(p.name)}</b></div><div>Umri/Jinsia: <b>${p.age} / ${p.g}</b></div><div>Simu: ${esc(p.tel)}</div><div>Tarehe: ${fdt(l.ts)}</div></div>
  <table class="w-full border text-xs"><tr class="bg-slate-100"><th class="border p-1">Kipimo / Test</th><th class="border p-1">Matokeo / Result</th><th class="border p-1">Kiwango / Reference</th></tr><tr><td class="border p-1">${esc(l.test)}</td><td class="border p-1 font-bold">${esc(l.result)}</td><td class="border p-1">${esc(l.range)}</td></tr></table>
  <p class="mt-3 text-xs">Maelezo / Remarks: ${esc(l.remark)||'—'}</p><div class="mt-8 text-xs flex justify-between"><span>Lab Tech: ____________</span><span>Sign/Stamp: ____________</span></div>`)}
function rxForm(id){const p=P(id);modal('Dawa / Prescription – '+esc(p.name),`<div class="space-y-2">${db.drugs.map(d=>{const c=(p.rx.find(r=>r.id==d.id)||{}).q||0;return `<div class="flex items-center gap-2 border rounded-xl p-2"><div class="flex-1 text-sm"><b>${esc(d.n)}</b><div class="text-xs text-slate-500">${TZS(d.p)} · stock ${d.s}</div></div><input type="number" min="0" max="${d.s}" value="${c}" data-d="${d.id}" class="inp !w-20 rq"></div>`}).join('')}</div><button class="btn w-full mt-3" onclick="rxSave(${id})">${ic('send')} Tuma Duka la Dawa / Send to Pharmacy</button>`)}
function rxSave(id){const p=P(id),r=[...document.querySelectorAll('.rq')].map(i=>({id:+i.dataset.d,q:Math.max(0,parseInt(i.value)||0)})).filter(x=>x.q>0);
  for(const x of r){const d=db.drugs.find(y=>y.id==x.id);if(x.q>d.s)return alert(d.n+': stock '+d.s)}
  p.rx=r;p.disp=0;p.status=r.length?STAT[2]:p.status;save();closeModal();render()}
function dispense(id){const p=P(id);for(const r of p.rx){if(db.drugs.find(d=>d.id==r.id).s<r.q)return alert('Stock haitoshi / Insufficient stock')}
  p.rx.forEach(r=>db.drugs.find(d=>d.id==r.id).s-=r.q);p.disp=1;p.status=STAT[3];logA('Dawa zimetolewa: '+p.name);save();render()}
function restock(id){const d=db.drugs.find(x=>x.id==id);modal('Ongeza Stock – '+esc(d.n),`<input id="rs" type="number" min="1" value="50" class="inp mb-3"><button class="btn w-full" onclick="const n=parseInt($('#rs').value);if(n>0){db.drugs.find(x=>x.id==${id}).s+=n;logA('Stock +'+n);save();closeModal();render()}">Ongeza / Add</button>`)}
function pay(id,ok){const p=P(id),b=bill(p),m=$('#pm'+id).value;
  if((p.rxNote||(p.rx||[]).length)&&!p.disp&&!ok)return ask('Dawa hazijatolewa. Endelea na malipo? / Drugs not dispensed. Continue?',()=>pay(id,1));
  const x={id:uid(),pid:id,name:p.name,amt:b.total,method:m,ts:nowTs(),by:me.name,lines:b.lines,items:b.lines.map(l=>l.n).join(', ')};db.bills.push(x);logA('Malipo '+TZS(b.total)+' ('+m+') – '+p.name);p.status=STAT[4];save();render();receipt(x.id)}
function rtxt(x,b){const t=[db.set.name,'RISITI #R'+String(x.id).slice(-5),fdt(x.ts),'Mgonjwa: '+x.name,'',...b.lines.map(l=>l.n+(l.q>1?' x'+l.q:'')+': '+l.t.toLocaleString('en-US')),'','JUMLA: '+TZS(x.total||x.amt),'Umelipa: '+TZS(x.amt)+(x.ins?' | Bima: '+TZS(x.ins):x.bal?' | Salio: '+TZS(x.bal):''),'Malipo: '+x.method,'Asante!'].join('\n');
  return `<div class="noprint mt-3"><label class="lbl">Risiti kama maandishi / Receipt as text</label><textarea id="rt" class="inp" rows="6" readonly>${esc(t)}</textarea><div class="flex gap-2 mt-2"><button class="btn2 flex-1" onclick="rtCopy()">${ic('copy')} Nakili / Copy</button><a class="btn2 flex-1" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(t)}">WhatsApp</a></div></div>`}
function rtCopy(){const a=$('#rt');a.select();const ok=()=>note('Imenakiliwa / Copied');try{navigator.clipboard.writeText(a.value).then(ok,()=>{document.execCommand('copy');ok()})}catch(e){document.execCommand('copy');ok()}}
function receipt(id){const x=db.bills.find(b=>b.id==id),p=P(x.pid),b=x.lines?{lines:x.lines}:bill(p);
  doc(`${hdr()}${x.void?`<div class="text-center text-rose-600 font-extrabold border-2 border-rose-600 rounded p-1 mb-2">BATILISHWA / VOID – ${esc(x.vr)}</div>`:''}<h4 class="text-center font-bold mb-2">RISITI / RECEIPT #R${String(x.id).slice(-5)}</h4><div class="text-xs mb-2">Mgonjwa: <b>${esc(x.name)}</b><br>Tarehe: ${fdt(x.ts)}<br>Njia ya Malipo: <b>${esc(x.method)}</b>${p.cat=='Insurance'?'<br>Category: Insurance/NHIF':''}</div>
  <table class="w-full text-xs">${b.lines.map(l=>`<tr class="border-b"><td class="py-1">${esc(l.n)}${l.q>1?' ×'+l.q:''}</td><td class="text-right">${l.t.toLocaleString('en-US')}</td></tr>`).join('')}<tr class="font-extrabold text-sm"><td class="pt-2">JUMLA / TOTAL</td><td class="text-right pt-2">${TZS(x.total||x.amt)}</td></tr>${x.total&&x.total!=x.amt?`<tr><td>Umelipa / Paid</td><td class="text-right">${TZS(x.amt)}</td></tr>${x.ins?`<tr class="font-bold"><td>Bima / Insurance</td><td class="text-right">${TZS(x.ins)}</td></tr>`:`<tr class="font-bold text-rose-600"><td>Salio / Balance</td><td class="text-right">${TZS(x.bal)}</td></tr>`}`:''}</table><p class="text-center text-xs mt-4">Asante! Pona haraka / Get well soon 🙏</p>`,rtxt(x,b))}
function settings(){if(!me||me.role!='boss')return;const s=db.set;modal('Mipangilio / Settings',`<div class="space-y-3"><div><label class="lbl">Jina la Zahanati</label><input id="s_n" class="inp" value="${esc(s.name)}"></div><div><label class="lbl">Anwani</label><input id="s_a" class="inp" value="${esc(s.addr)}"></div><div><label class="lbl">Simu</label><input id="s_t" class="inp" value="${esc(s.tel)}"></div><div><label class="lbl">Ada ya Ushauri / Consultation Fee (TZS)</label><input id="s_f" type="number" class="inp" value="${s.fee}"></div>
  <h4 class="font-bold text-sm pt-2">Wafanyakazi / Staff</h4>${staffUI()}
  <button class="btn w-full" onclick="setSave()">Hifadhi / Save</button>
  <h4 class="font-bold text-sm pt-2">Nakala ya Data / Backup</h4><textarea id="bk" class="inp" rows="3" placeholder="Bandika data hapa kurejesha / Paste here to restore"></textarea><div class="flex gap-2"><button class="btn2 flex-1" onclick="bkCopy()">Nakili / Copy</button><button class="btn2 flex-1" onclick="bkRestore()">Rejesha / Restore</button></div>
  <h4 class="font-bold text-sm pt-2">Rekodi za Shughuli / Activity Log</h4><div class="text-xs max-h-40 overflow-y-auto space-y-1">${db.log.slice(0,25).map(x=>`<div>${fdt(x.ts)} · <b>${esc(x.who)}</b> · ${esc(x.a)}</div>`).join('')||'—'}</div>
  </div>`)}
function bkCopy(){const t=JSON.stringify(db),a=$('#bk');a.value=t;a.select();try{navigator.clipboard.writeText(t).then(()=>alert('Imenakiliwa / Copied'),()=>document.execCommand('copy'))}catch(e){document.execCommand('copy')}}
function bkRestore(){try{const d=JSON.parse($('#bk').value);if(!d.patients||!d.users)throw 0;ask('Badilisha data zote? / Replace all data?',()=>{db=d;if(!db.log)db.log=[];me=db.users.find(u=>u.id==me.id)||null;save();render()})}catch(e){alert('Data si sahihi / Invalid data')}}
function setSave(){db.set={name:$('#s_n').value,addr:$('#s_a').value,tel:$('#s_t').value,fee:+$('#s_f').value||0};logA('Mipangilio imebadilishwa');save();closeModal();render()}
/* Prescription = doctor's free text; pharmacy picks drugs from stock (these override earlier versions) */
function rxForm(id){const p=P(id);modal('Dawa / Prescription – '+esc(p.name),`<label class="lbl">Andika dawa, kipimo na siku / Write drugs, dose and days</label><textarea id="rn" rows="6" class="inp" placeholder="Mfano:&#10;Amoxicillin 500mg - 1 cap mara 3 kwa siku 5&#10;Panadol 500mg - 2 tab mara 3 kwa siku 3">${esc(p.rxNote||'')}</textarea><button class="btn w-full mt-3" onclick="rxSave(${id})">${ic('send')} Tuma Duka la Dawa / Send to Pharmacy</button>`)}
function rxSave(id){const t=$('#rn').value.trim();if(!t)return alert('Andika dawa / Write the prescription');const p=P(id);p.rxNote=t;p.rx=[];p.disp=0;p.status=STAT[2];logA('Dawa zimeandikwa: '+p.name);save();closeModal();render()}
function dispense(id){const p=P(id);modal('Toa Dawa / Dispense – '+esc(p.name),`${p.rxNote?`<div class="bg-amber-50 border border-amber-200 rounded-xl p-2 mb-3 text-sm whitespace-pre-wrap">${esc(p.rxNote)}</div>`:''}<div class="space-y-2">${db.drugs.map(d=>{const c=((p.rx||[]).find(r=>r.id==d.id)||{}).q||0;return `<div class="flex items-center gap-2 border rounded-xl p-2"><div class="flex-1 text-sm"><b>${esc(d.n)}</b><div class="text-xs text-slate-500">${TZS(d.p)} · stock ${d.s}${d.exp?` · Exp ${d.exp}${expired(d)?' ⛔ IMEKWISHA':''}`:''}</div></div><input type="number" min="0" max="${d.s}" value="${expired(d)?0:c}" ${expired(d)?'disabled':''} data-d="${d.id}" class="inp !w-20 dq"></div>`}).join('')}</div><button class="btn w-full mt-3" onclick="dispSave(${id})">${ic('package-check')} Thibitisha / Confirm</button>`)}
function dispSave(id){const p=P(id),r=[...document.querySelectorAll('.dq')].map(i=>({id:+i.dataset.d,q:Math.max(0,parseInt(i.value)||0)})).filter(x=>x.q>0);if(!r.length)return alert('Chagua angalau dawa moja / Pick at least one drug');
  for(const x of r){const d=db.drugs.find(y=>y.id==x.id);if(x.q>d.s)return alert(d.n+': stock '+d.s)}
  r.forEach(x=>db.drugs.find(d=>d.id==x.id).s-=x.q);p.rx=r;p.disp=1;p.status=STAT[3];logA('Dawa zimetolewa: '+p.name);save();closeModal();render()}
function drugForm(){modal('Dawa Mpya / New Drug',`<div class="space-y-3"><div><label class="lbl">Jina na nguvu / Name & strength</label><input id="dn" class="inp" placeholder="e.g. Ibuprofen 400mg (tab)"></div><div class="grid grid-cols-2 gap-2"><div><label class="lbl">Bei kwa kipimo / Unit price (TZS)</label><input id="dp" type="number" min="0" class="inp"></div><div><label class="lbl">Idadi / Quantity</label><input id="ds" type="number" min="0" class="inp"></div></div><button class="btn w-full" onclick="drugSave()">Hifadhi / Save</button></div>`)}
function drugSave(){const n=$('#dn').value.trim(),p=parseInt($('#dp').value),s=parseInt($('#ds').value);if(!n||!(p>=0)||!(s>=0))return alert('Jaza jina, bei na idadi / Fill name, price and quantity');if(db.drugs.some(d=>d.n.toLowerCase()==n.toLowerCase()))return alert('Dawa hii ipo tayari – tumia + / Already exists – use +');db.drugs.push({id:Math.max(0,...db.drugs.map(d=>d.id))+1,n,p,s});logA('Dawa mpya: '+n+' x'+s);save();closeModal();render()}

/* Partial payments, debts, insurance claims (pay() overrides the earlier version) */
function pay(id,ok){const p=P(id),b=bill(p),m=$('#pm'+id).value,a=Math.round(+$('#pa'+id).value);
  if(!(a>0&&a<=b.total))return alert('Kiasi si sahihi / Invalid amount');
  if((p.rxNote||(p.rx||[]).length)&&!p.disp&&!ok)return ask('Dawa hazijatolewa. Endelea na malipo? / Drugs not dispensed. Continue?',()=>pay(id,1));
  const x={id:uid(),pid:id,name:p.name,amt:a,total:b.total,bal:b.total-a,method:m,ts:nowTs(),by:me.name,lines:b.lines,items:b.lines.map(l=>l.n).join(', ')};
  db.bills.push(x);p.owed=(p.owed||0)+b.total-a;p.status=STAT[4];logA('Malipo '+TZS(a)+' ('+m+') – '+p.name+(p.owed?' | deni '+TZS(p.owed):''));save();render();receipt(x.id)}
function debtsUI(){const l=db.patients.filter(p=>p.owed>0);return `<h2 class="font-bold text-teal-800 mt-5 mb-2">Madeni / Outstanding Balances (${l.length}) · ${TZS(l.reduce((a,p)=>a+p.owed,0))}</h2><div class="grid md:grid-cols-2 gap-3">${l.map(p=>`<div class="card"><div class="flex justify-between"><b>${esc(p.name)}</b><b class="text-rose-600">${TZS(p.owed)}</b></div><div class="text-xs text-slate-500">${esc(p.tel)}</div><div class="flex gap-2 mt-2"><input id="da${p.id}" type="number" min="1" max="${p.owed}" value="${p.owed}" class="inp"><select id="dm${p.id}" class="inp">${METH.map(m=>`<option>${m}</option>`).join('')}</select></div><button class="btn w-full mt-2" onclick="payDebt(${p.id})">Lipa Deni / Pay Balance</button></div>`).join('')||'<p class="text-slate-500 text-sm">Hakuna madeni / No debts ✔</p>'}</div>`}
function payDebt(id){const p=P(id),a=Math.round(+$('#da'+id).value),m=$('#dm'+id).value;if(!(a>0&&a<=p.owed))return alert('Kiasi si sahihi / Invalid amount');
  const last=[...db.bills].reverse().find(x=>x.pid==id&&x.lines);p.owed-=a;
  const x={id:uid(),pid:id,name:p.name,amt:a,total:last?(last.total||last.amt):a,bal:p.owed,method:m,ts:nowTs(),by:me.name,lines:last?last.lines:[{n:'Deni / Balance',q:1,t:a}],items:'Deni / Balance payment'};
  db.bills.push(x);logA('Deni '+TZS(a)+' – '+p.name);save();render();receipt(x.id)}
function claim(id){db.claims=db.claims||[];const p=P(id),b=bill(p);db.claims.push({id:uid(),pid:id,name:p.name,total:b.total,lines:b.lines,ts:nowTs(),st:'Pending'});p.status=STAT[4];logA('Madai: '+p.name+' '+TZS(b.total));save();render();note('Madai yamehifadhiwa / Claim saved')}
function claimsUI(){db.claims=db.claims||[];const l=db.claims.filter(c=>c.st=='Pending');return `<h2 class="font-bold text-teal-800 mt-5 mb-2">Madai ya Bima / Insurance Claims (${l.length}) · ${TZS(l.reduce((a,c)=>a+c.total,0))}</h2><div class="space-y-2">${l.map(c=>`<div class="card flex justify-between items-center"><div><b>${esc(c.name)}</b><div class="text-xs text-slate-500">${fdt(c.ts)} · ${TZS(c.total)}</div></div><button class="btn2" onclick="claimPaid(${c.id})">Imelipwa / Paid</button></div>`).join('')||'<p class="text-slate-500 text-sm">Hakuna madai / No pending claims</p>'}</div>`}
function claimPaid(id){const c=db.claims.find(x=>x.id==id);c.st='Paid';const x={id:uid(),pid:c.pid,name:c.name,amt:c.total,total:c.total,bal:0,method:'Bank Transfer',ts:nowTs(),by:me.name,lines:c.lines,items:'Madai ya Bima / Insurance claim'};db.bills.push(x);logA('Madai yamelipwa: '+c.name);save();render()}
/* Void receipts (boss) and edit patient (reception/boss) */
function voidForm(id){if(me.role!='boss')return;const x=db.bills.find(b=>b.id==id);modal('Batilisha Risiti / Void Receipt',`<p class="text-sm mb-2"><b>${esc(x.name)}</b> · ${TZS(x.amt)} · ${esc(x.method)}</p><label class="lbl">Sababu / Reason (inahitajika)</label><input id="vr" class="inp mb-3" placeholder="Mfano: kiasi kimekosewa"><button class="btn w-full !bg-rose-600" onclick="voidSave(${id})">Batilisha / Void</button>`)}
function voidSave(id){if(me.role!='boss')return;const r=$('#vr').value.trim();if(r.length<3)return alert('Andika sababu / Enter a reason');
  const x=db.bills.find(b=>b.id==id),p=P(x.pid),it=x.items||'';x.void=1;x.vr=r;x.vby=me.name;x.vts=nowTs();
  if(it.startsWith('Deni')){if(p)p.owed=(p.owed||0)+x.amt}
  else if(it.startsWith('Madai')){const c=[...(db.claims||[])].reverse().find(c=>c.pid==x.pid&&c.st=='Paid');if(c)c.st='Pending'}
  else if(p){p.owed=Math.max(0,(p.owed||0)-(x.bal||0));p.status=STAT[3]}
  logA('BATILISHWA risiti #'+id+' '+TZS(x.amt)+' – '+r);save();closeModal();render()}

function fileView(id){const p=P(id),ev=[],dt=t=>String(t).length>10?fdt(t):new Date(t).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});

  if(can('clin')){(p.hist||[]).forEach(h=>ev.push([h.ts,'🩺','Maelezo – '+h.by,h.t]));
    db.labs.filter(l=>l.pid==id).forEach(l=>ev.push([l.ts||l.date,'🧪',l.test,l.done?l.result+(l.remark?' – '+l.remark:''):'Inasubiri / Pending']));
    (p.visits||[]).forEach(v=>{if(v.rxNote)ev.push([v.date,'💊','Dawa',v.rxNote])});if(p.rxNote)ev.push([p.date,'💊','Dawa',p.rxNote])}

function newVisit(id){const p=P(id);(p.visits=p.visits||[]).push({vid:p.vid||0,date:p.date,rxNote:p.rxNote||'',rx:p.rx||[]});p.vid=(p.vid||0)+1;p.date=today();p.status=STAT[0];p.rx=[];p.rxNote='';p.disp=0;logA('Ziara mpya: '+p.name);save();closeModal();render()}
/* Printable close-out, drug expiry, insurance co-pay (these override earlier versions) */
function closeDoc(){const t=today(),all=db.bills.filter(x=>x.ts.slice(0,10)==t),b=all.filter(x=>!x.void),vd=all.filter(x=>x.void),tot=b.reduce((a,x)=>a+x.amt,0),debts=db.patients.reduce((a,p)=>a+(p.owed||0),0),cl=(db.claims||[]).filter(c=>c.st=='Pending').reduce((a,c)=>a+c.total,0),rows=METH.map(m=>[m,b.filter(x=>x.method==m).reduce((a,x)=>a+x.amt,0)]).filter(r=>r[1]);
  doc(`${hdr()}<h4 class="text-center font-bold mb-2">RIPOTI YA KUFUNGA SIKU / DAILY CLOSE-OUT</h4><div class="text-xs mb-2">Tarehe: <b>${t}</b> · Imeandaliwa na: ${esc(me.name)}</div><table class="w-full text-xs">${rows.map(r=>`<tr class="border-b"><td class="py-1">${r[0]}</td><td class="text-right">${r[1].toLocaleString('en-US')}</td></tr>`).join('')}<tr class="font-extrabold text-sm"><td class="pt-2">JUMLA (${b.length} risiti)</td><td class="text-right pt-2">${TZS(tot)}</td></tr></table><div class="text-xs mt-3 space-y-1"><div>Risiti zilizobatilishwa / Voided: ${vd.length} (${TZS(vd.reduce((a,x)=>a+x.amt,0))})</div><div>Madeni yote / Total debts: ${TZS(debts)}</div><div>Madai ya bima yanayosubiri / Pending claims: ${TZS(cl)}</div></div><div class="mt-8 text-xs flex justify-between"><span>Mhasibu: ____________</span><span>Bosi: ____________</span></div>`)}

 sync(){COLS.forEach(c=>db[c].forEach(o=>{const id=String(o.id),j=JSON.stringify(o);if(last[c][id]!==j){last[c][id]=j;setDoc(doc(fs,c,id),JSON.parse(j)).catch(err('save '+c))}}));
  const sj=JSON.stringify(db.set);if(me&&me.role=='boss'&&last.set!==sj){last.set=sj;setDoc(doc(fs,'meta','settings'),JSON.parse(sj)).catch(err('settings'))}},
 async addStaff(name,email,pw,role){const sec=initializeApp(cfg,'sec'+Date.now());try{const c=await createUserWithEmailAndPassword(getAuth(sec),email,pw);await setDoc(doc(fs,'users',c.user.uid),{name,role,email});await signOut(getAuth(sec));note('Akaunti imetengenezwa / Account created')}catch(e){note('Imeshindikana / Failed: '+(e.code||e.message))}finally{deleteApp(sec)}},
 async rmStaff(id){if(me&&me.role=='boss')try{await deleteDoc(doc(fs,'users',id));note('Ameondolewa / Removed')}catch(e){err('users')(e)}}};
const DRUGS=[[1,'Panadol 500mg (tab)',200,400],[2,'Amoxicillin 500mg (cap)',500,200],[3,'Artemether/Lumefantrine (course)',3000,60],[4,'ORS Sachet',500,80],[5,'Metronidazole 400mg (tab)',300,150],[6,'Cotrimoxazole 480mg (tab)',150,100]];
onAuthStateChanged(auth,async u=>{un.forEach(f=>f());un=[];
 if(!u){setMe(null);window.READY=1;render();return}
 try{let us=await getDoc(doc(fs,'users',u.uid));
  if(!us.exists()){const b=await getDoc(doc(fs,'meta','bootstrap'));
   if(b.exists()){note('Akaunti hii haina ruhusa / No access – ask the owner');await signOut(auth);return}
   await setDoc(doc(fs,'users',u.uid),{name:'Bosi / Owner',role:'boss',email:u.email});await setDoc(doc(fs,'meta','bootstrap'),{uid:u.uid});us=await getDoc(doc(fs,'users',u.uid))}
  const d=us.data();window.READY=1;setMe({id:u.uid,name:d.name,role:d.role,email:u.email});listen(d.role);
  if(d.role=='boss'){const s=await getDoc(doc(fs,'meta','settings'));if(!s.exists()){await setDoc(doc(fs,'meta','settings'),db.set);for(const r of DRUGS)await setDoc(doc(fs,'drugs',String(r[0])),{id:r[0],n:r[1],p:r[2],s:r[3],exp:''})}}
  FB.log({ts:nowTs(),who:d.name,a:'Ameingia / Login'})
 }catch(e){err('login')(e);window.READY=1;render()}});
